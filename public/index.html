<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas Seguras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .password-strength-weak { background: linear-gradient(90deg, #ef4444 0%, #ef4444 33%, #e5e7eb 33%); }
        .password-strength-medium { background: linear-gradient(90deg, #eab308 0%, #eab308 66%, #e5e7eb 66%); }
        .password-strength-strong { background: linear-gradient(90deg, #22c55e 0%, #22c55e 100%); }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .toast {
            transform: translateX(400px);
            transition: transform 0.3s ease-in-out;
        }
        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <header class="glass-effect shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-key text-purple-600 text-2xl"></i>
                    <h1 class="text-2xl font-bold text-gray-800">KeyGen Pro</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fas fa-moon text-gray-600"></i>
                    </button>
                    <span class="text-sm text-gray-600" id="userCount">0 usuarios</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="grid lg:grid-cols-2 gap-8">
            <!-- Password Generator Section -->
            <section class="glass-effect rounded-2xl p-8 shadow-xl animate-float">
                <div class="flex items-center mb-6">
                    <i class="fas fa-shield-alt text-purple-600 text-3xl mr-3"></i>
                    <h2 class="text-2xl font-bold text-gray-800">Generador de Contraseñas</h2>
                </div>

                <div class="space-y-6">
                    <!-- Username Input -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user mr-2"></i>Nombre de Usuario
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Ingrese su nombre de usuario"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        >
                    </div>

                    <!-- Password Length -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-ruler mr-2"></i>Longitud: <span id="lengthValue" class="font-bold text-purple-600">24</span>
                        </label>
                        <input 
                            type="range" 
                            id="passwordLength" 
                            min="8" 
                            max="64" 
                            value="24"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600"
                        >
                    </div>

                    <!-- Character Options -->
                    <div class="space-y-3">
                        <label class="block text-sm font-medium text-gray-700">
                            <i class="fas fa-cog mr-2"></i>Opciones de Caracteres
                        </label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="uppercase" checked class="w-4 h-4 text-purple-600 rounded">
                                <span class="text-sm">Mayúsculas (A-Z)</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="lowercase" checked class="w-4 h-4 text-purple-600 rounded">
                                <span class="text-sm">Minúsculas (a-z)</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="numbers" checked class="w-4 h-4 text-purple-600 rounded">
                                <span class="text-sm">Números (0-9)</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="symbols" checked class="w-4 h-4 text-purple-600 rounded">
                                <span class="text-sm">Símbolos (!@#$%)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Generated Password Display -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>Contraseña Generada
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="generatedPassword" 
                                readonly
                                placeholder="Haz clic en 'Generar' para crear una contraseña"
                                class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg bg-gray-50 font-mono text-sm"
                            >
                            <button 
                                onclick="togglePasswordVisibility()"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                            >
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                        <div class="mt-2">
                            <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div id="strengthBar" class="h-full transition-all duration-300 password-strength-medium"></div>
                            </div>
                            <p id="strengthText" class="text-xs text-gray-600 mt-1">Fuerza: Media</p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-3">
                        <button 
                            onclick="generatePassword()"
                            class="flex-1 bg-purple-600 text-white py-3 px-6 rounded-lg hover:bg-purple-700 transition-colors font-medium shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                        >
                            <i class="fas fa-magic mr-2"></i>Generar Contraseña
                        </button>
                        <button 
                            onclick="copyPassword()"
                            class="bg-gray-600 text-white py-3 px-6 rounded-lg hover:bg-gray-700 transition-colors font-medium"
                        >
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>

                    <!-- Save User Button -->
                    <button 
                        onclick="saveUser()"
                        class="w-full bg-green-600 text-white py-3 px-6 rounded-lg hover:bg-green-700 transition-colors font-medium shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                    >
                        <i class="fas fa-save mr-2"></i>Guardar Usuario y Contraseña
                    </button>
                </div>
            </section>

            <!-- Users List Section -->
            <section class="glass-effect rounded-2xl p-8 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <i class="fas fa-users text-purple-600 text-3xl mr-3"></i>
                        <h2 class="text-2xl font-bold text-gray-800">Usuarios Guardados</h2>
                    </div>
                    <button 
                        onclick="refreshUsers()"
                        class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
                    >
                        <i class="fas fa-sync-alt text-gray-600"></i>
                    </button>
                </div>

                <!-- Search Bar -->
                <div class="mb-4">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="searchUsers" 
                            placeholder="Buscar usuarios..."
                            onkeyup="searchUsers()"
                            class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        >
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Users List -->
                <div id="usersList" class="space-y-3 max-h-96 overflow-y-auto">
                    <!-- Users will be loaded here dynamically -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="text-center py-12 hidden">
                    <i class="fas fa-user-slash text-6xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500">No hay usuarios guardados aún</p>
                    <p class="text-sm text-gray-400 mt-2">Genera y guarda tu primer usuario</p>
                </div>
            </section>
        </div>

        <!-- Statistics Section -->
        <section class="mt-8 glass-effect rounded-2xl p-8 shadow-xl">
            <h3 class="text-xl font-bold text-gray-800 mb-6">
                <i class="fas fa-chart-bar mr-2 text-purple-600"></i>Estadísticas
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="text-center">
                    <div class="text-3xl font-bold text-purple-600" id="totalUsers">0</div>
                    <p class="text-sm text-gray-600 mt-1">Total Usuarios</p>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-green-600" id="todayUsers">0</div>
                    <p class="text-sm text-gray-600 mt-1">Usuarios Hoy</p>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-blue-600" id="avgPasswordLength">0</div>
                    <p class="text-sm text-gray-600 mt-1">Longitud Promedio</p>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-orange-600" id="strongPasswords">0</div>
                    <p class="text-sm text-gray-600 mt-1">Contraseñas Fuertes</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Component -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="glass-effect rounded-2xl p-8 max-w-md w-full mx-4 transform transition-all duration-300 scale-95 opacity-0" id="modalContent">
            <div class="flex items-center mb-4">
                <div id="modalIcon" class="mr-3"></div>
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800"></h3>
            </div>
            <p id="modalMessage" class="text-gray-600 mb-6"></p>
            <div id="modalActions" class="flex justify-end space-x-3">
                <!-- Actions will be inserted here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
